:root{
  --paper:#E8C547;
  --paper-dark:#c9a632;
  --cinnabar:#C8102E;
  --cinnabar-dark:#8f0a20;
  --gold:#F3C64B;
  --gold-deep:#B8860B;
  --ink:#0b0a10;
  --text:#f4ecff;
  --muted:#b9a8d6;
  --brush:'XR Kai','LXGW WenKai TC','Kaiti TC','BiauKai','DFKai-SB','STKaiti','KaiTi',-apple-system,'PingFang TC',sans-serif;
  --title:'XR Title',var(--brush);
  --sans:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;overflow:hidden;
  background:#0a0610;color:var(--text);font-family:var(--sans);
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

/* ---------- 陰間背景 ---------- */
#app{position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(120% 70% at 50% 18%, #3a1a5c 0%, #22103a 38%, #120820 70%, #07040c 100%);
}
.fog{position:absolute;inset:-20%;pointer-events:none;z-index:0}
.fog i{position:absolute;border-radius:50%;opacity:.55;will-change:transform}
.fog i:nth-child(1){width:90vmax;height:40vmax;left:-20%;top:55%;
  background:radial-gradient(closest-side,rgba(150,110,200,.22),rgba(150,110,200,0));animation:fogA 26s ease-in-out infinite alternate}
.fog i:nth-child(2){width:80vmax;height:35vmax;right:-25%;top:30%;
  background:radial-gradient(closest-side,rgba(120,80,170,.20),rgba(120,80,170,0));animation:fogB 31s ease-in-out infinite alternate}
.fog i:nth-child(3){width:100vmax;height:30vmax;left:-10%;top:78%;
  background:radial-gradient(closest-side,rgba(190,160,230,.16),rgba(190,160,230,0));animation:fogA 22s ease-in-out infinite alternate-reverse}
@keyframes fogA{from{transform:translateX(-8%)}to{transform:translateX(10%)}}
@keyframes fogB{from{transform:translateX(6%) translateY(2%)}to{transform:translateX(-10%) translateY(-3%)}}

/* ---------- 畫面切換 ---------- */
.screen{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 30px);
  opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s}
.screen.active{opacity:1;visibility:visible;transition:opacity .25s ease}
.footnote{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 8px);z-index:5;
  text-align:center;font-size:12px;color:rgba(220,205,245,.55);pointer-events:none;letter-spacing:.05em}

/* ---------- 共用按鈕 ---------- */
.btn{display:block;width:100%;max-width:340px;margin:0 auto;padding:16px 18px;border-radius:16px;
  font-size:20px;font-weight:700;letter-spacing:.12em;transition:transform .08s ease,filter .1s}
.btn:active{transform:scale(.96);filter:brightness(1.1)}
.btn-red{background:linear-gradient(180deg,#e01a3a,var(--cinnabar) 55%,var(--cinnabar-dark));
  color:#fff7d6;border:2px solid var(--gold);box-shadow:0 6px 0 #5c0614,0 10px 24px rgba(200,16,46,.35);
  font-family:var(--brush);font-size:28px;font-weight:400}
.btn-ghost{background:rgba(255,255,255,.06);border:1.5px solid rgba(232,197,71,.55);color:var(--paper)}
.btn-small{font-size:15px;padding:10px 14px;width:auto;border-radius:12px;letter-spacing:.06em}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.back{font-size:16px;color:var(--muted);padding:8px 4px}
h2.brush{font-family:var(--brush);font-weight:400;color:var(--paper);font-size:38px;text-align:center;
  text-shadow:0 2px 0 var(--cinnabar-dark),0 0 18px rgba(232,197,71,.25)}

/* ---------- 開始畫面 ---------- */
#scr-start{align-items:center;justify-content:space-between;text-align:center}
.title-wrap{margin-top:6vh}
.title{font-family:var(--title);font-weight:400;font-size:clamp(52px,18vw,92px);white-space:nowrap;line-height:1;
  color:var(--paper);letter-spacing:.06em;
  text-shadow:0 4px 0 var(--cinnabar),0 8px 0 #4a0410,0 0 30px rgba(232,197,71,.3)}
.subtitle{margin-top:18px;font-size:18px;color:var(--muted);letter-spacing:.2em}
.hero{position:relative;width:200px;height:230px;margin:0 auto}
.hero .mini{position:absolute;left:40px;bottom:0;width:120px;height:156px;animation:bob 2.4s ease-in-out infinite}
.hero .tag{position:absolute;left:50%;top:22px;transform:translateX(-50%) rotate(-4deg);
  font-family:var(--title);font-size:22px;color:var(--cinnabar-dark);background:var(--paper);
  padding:2px 14px;border-top:3px solid var(--cinnabar);border-bottom:3px solid var(--cinnabar);animation:bob 2.4s ease-in-out infinite}
.hero .slap{position:absolute;right:-26px;top:58px;width:96px;transform-origin:92% 80%;animation:slapIdle 1.6s ease-in infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes slapIdle{0%,55%{transform:rotate(70deg)}68%{transform:rotate(-4deg)}74%{transform:rotate(2deg)}100%{transform:rotate(70deg)}}
.start-btns{width:100%;display:flex;flex-direction:column;gap:14px;margin-bottom:5vh}

/* ---------- 建立小人 ---------- */
#scr-create .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:360px;width:100%;margin:0 auto}
.field-label{font-size:16px;color:var(--muted);letter-spacing:.1em}
.name-input{width:100%;font-size:24px;padding:14px 16px;border-radius:14px;
  background:var(--paper);color:#3a0710;border:3px solid var(--cinnabar);font-family:var(--brush);
  outline:none;text-align:center;letter-spacing:.08em}
.name-input::placeholder{color:rgba(90,20,30,.45)}
.hint-small{font-size:13px;color:var(--muted);text-align:center}
.counter{font-size:12px;color:var(--muted);text-align:right;margin-top:-10px}

/* ---------- 選武器 ---------- */
#scr-weapon .cards{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:380px;width:100%;margin:0 auto}
.wcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;text-align:left;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  border:2px solid rgba(232,197,71,.35);transition:transform .08s,border-color .15s}
.wcard:active{transform:scale(.97);border-color:var(--paper)}
.wcard .icon{width:84px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;font-size:52px}
.wcard .icon svg{width:84px;height:auto}
.wcard .wname{font-family:var(--brush);font-size:30px;color:var(--paper);line-height:1.1}
.wcard .pips{margin:4px 0 2px;display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted)}
.wcard .pips b{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--cinnabar);box-shadow:inset 0 0 0 1.5px var(--gold)}
.wcard .pips b.off{background:rgba(255,255,255,.1);box-shadow:none}
.wcard .wdesc{font-size:14px;color:var(--muted)}
#weaponSub{text-align:center;color:var(--muted);font-size:15px;margin-top:6px;min-height:1em}

/* ---------- 開打 ---------- */
#scr-fight{padding:calc(var(--safe-t) + 6px) 0 calc(var(--safe-b) + 28px)}
.fight-top{display:flex;align-items:center;gap:10px;padding:0 12px;z-index:3;position:relative}
.icon-btn{min-width:48px;height:44px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:15px;padding:0 10px}
#btnMute{font-size:22px}
.hp{flex:1}
.hp-label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:4px;padding:0 2px}
.hp-label b{color:#fff;font-size:15px}
.hp-bar{position:relative;height:16px;border-radius:9px;background:rgba(0,0,0,.55);border:2px solid rgba(232,197,71,.55);overflow:hidden}
.hp-bar .ghost,.hp-bar .fill{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:0 50%}
.hp-bar .ghost{background:#fff3c4;transition:transform .45s ease .18s}
.hp-bar .fill{background:linear-gradient(180deg,#ff4d5e,var(--cinnabar) 60%,#7d0819);transition:transform .08s linear}
#arena{position:relative;flex:1;overflow:hidden;touch-action:none;will-change:transform}
#stage{position:absolute;inset:0}
#stars{position:absolute;inset:0;opacity:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 10%,#0c1236,#05060f 70%)}
#stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
#dollAnchor{--s:1;--h:min(50vh,330px);position:absolute;left:50%;bottom:13%;width:0;height:0;transition:bottom .45s cubic-bezier(.3,1.4,.5,1)}
.ground{position:absolute;left:0;bottom:-10px;width:calc(var(--h) * .62 * var(--s));height:22px;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0));transition:width .25s}
#dollKnock{position:absolute;left:0;bottom:0;width:0;height:0;transform-origin:50% 100%}
#dollScale{position:absolute;bottom:0;left:calc(var(--h) * -.385);width:calc(var(--h) * .77);height:var(--h);
  transform:scale(var(--s));transform-origin:50% 100%;transition:transform .28s cubic-bezier(.3,1.7,.5,1)}
#dollTremble{width:100%;height:100%}
#dollTremble.tremble{animation:tremble .09s steps(2) infinite}
@keyframes tremble{0%{transform:translate(-2px,1px) rotate(-1.5deg)}50%{transform:translate(2px,-1px) rotate(1.5deg)}100%{transform:translate(-1px,0) rotate(-.5deg)}}
#dollSvg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px rgba(190,150,255,.45)) drop-shadow(0 0 18px rgba(150,100,230,.25))}
#dollSvg.flash{filter:brightness(0) invert(1) drop-shadow(0 0 14px #fff)}
#dollSvg .arm{transform-box:fill-box;transform-origin:50% 8%;transition:transform .12s ease-out}
#dollSvg.hurt .armL{transform:rotate(95deg)}
#dollSvg.hurt .armR{transform:rotate(-95deg)}
#dollSvg .bump{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);opacity:0;transition:transform .25s cubic-bezier(.3,2,.5,1),opacity .1s}
#dollSvg.b1 .bump1,#dollSvg.b2 .bump2,#dollSvg.b3 .bump3{transform:scale(1);opacity:1}
#dollSvg .crack{stroke-dasharray:120;stroke-dashoffset:120;transition:stroke-dashoffset .35s ease-out}
#dollSvg.c1 .crack1,#dollSvg.c2 .crack2,#dollSvg.c3 .crack3{stroke-dashoffset:0}
#nameTag{position:absolute;left:0;bottom:calc(var(--h) * var(--s) + 6px);transform:translateX(-50%) scale(calc(.62 + .38 * var(--s))) rotate(-3deg);
  transform-origin:50% 100%;transition:bottom .28s cubic-bezier(.3,1.7,.5,1),transform .28s;
  white-space:nowrap;background:linear-gradient(180deg,#f0d066,var(--paper) 40%,#d9b53a);color:#5a0612;
  font-family:var(--brush);font-size:26px;line-height:1.15;padding:4px 16px 2px;
  border-top:4px double var(--cinnabar);border-bottom:4px double var(--cinnabar);
  box-shadow:0 4px 10px rgba(0,0,0,.45);pointer-events:none}
#bubble{position:absolute;left:0;top:0;max-width:min(56vw,230px);padding:10px 14px;border-radius:18px;
  background:#fffaf0;color:#2a0b18;font-size:17px;font-weight:700;line-height:1.3;
  box-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none;opacity:0;transform:scale(.6);transform-origin:50% 100%;
  transition:opacity .12s,transform .18s cubic-bezier(.3,1.8,.5,1);z-index:4}
#bubble.show{opacity:1;transform:scale(1)}
#bubble::after{content:"";position:absolute;bottom:-9px;width:18px;height:18px;background:#fffaf0;transform:rotate(45deg);border-radius:3px}
#bubble.tail-left::after{left:18px}
#bubble.tail-right::after{right:18px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5}
#fx > *{position:absolute;left:0;top:0;will-change:transform,opacity}
.swing{width:120px;height:60px;transform-origin:92% 85%}
.swing svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.swing.fist{width:80px;height:80px;font-size:70px;line-height:80px;text-align:center;transform-origin:50% 50%}
.burst{width:110px;height:110px;margin:-55px 0 0 -55px}
.ono{font-family:var(--brush);font-size:40px;color:var(--paper);white-space:nowrap;
  -webkit-text-stroke:2px var(--cinnabar-dark);text-shadow:0 3px 0 #3a0610;margin:-24px 0 0 -30px}
.dmg{font-weight:900;font-size:30px;color:#fff;white-space:nowrap;margin:-18px 0 0 -20px;
  -webkit-text-stroke:1.5px var(--cinnabar);text-shadow:0 3px 0 rgba(0,0,0,.6)}
.dmg.crit{font-size:44px;color:var(--gold);-webkit-text-stroke:2px #7a0010}
.drop{border-radius:50%;background:radial-gradient(circle at 35% 30%,#555 0,#111 35%,#000 70%);box-shadow:0 0 0 1px rgba(200,170,255,.35)}
.scrap{width:10px;height:14px;background:var(--paper);border:1px solid #a1801d}
#rage{position:absolute;right:10px;top:12%;height:44%;width:24px;border-radius:14px;z-index:4;
  background:rgba(0,0,0,.55);border:2px solid rgba(232,197,71,.6);overflow:hidden;pointer-events:none}
#rageFill{position:absolute;left:0;right:0;bottom:0;height:100%;transform:scaleY(0);transform-origin:50% 100%;
  background:linear-gradient(0deg,#f7d046,#ff8a1f 55%,#ff2a3d)}
#rage .label{position:absolute;right:6px;top:calc(12% - 30px);z-index:4;font-family:var(--brush);font-size:24px;color:var(--paper);pointer-events:none}
#arena.crit #rage{border-color:#fff;box-shadow:0 0 16px #ffd34d,0 0 30px #ff5a2a}
#arena.crit #rageFill{background:linear-gradient(0deg,#fff6b0,#ffd34d);animation:rageGlow .2s steps(2) infinite}
@keyframes rageGlow{50%{filter:brightness(1.4)}}
#critBanner{position:absolute;left:0;right:40px;top:3%;text-align:center;z-index:6;pointer-events:none;
  font-family:var(--brush);font-size:clamp(34px,10.5vw,48px);color:var(--gold);-webkit-text-stroke:2px #7a0010;text-shadow:0 4px 0 #3a0610,0 0 24px #ff8a1f;
  opacity:0;transform:scale(2)}
#arena.crit #critBanner{animation:critIn .35s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes critIn{to{opacity:1;transform:scale(1)}}
#combo{position:absolute;left:14px;top:12%;z-index:4;pointer-events:none;font-family:var(--brush);
  color:var(--paper);font-size:34px;-webkit-text-stroke:1.5px var(--cinnabar-dark);opacity:0;transition:opacity .3s}
#combo.show{opacity:1}
#combo small{display:block;font-size:20px;color:var(--muted);-webkit-text-stroke:0}
#tapHint{position:absolute;left:0;right:0;bottom:3%;text-align:center;font-size:15px;color:var(--muted);pointer-events:none;letter-spacing:.15em;
  animation:pulse 1.4s ease-in-out infinite;transition:opacity .4s}
#tapHint.hide{opacity:0;animation:none}
@keyframes pulse{50%{opacity:.4}}
#flash{position:fixed;inset:0;z-index:50;pointer-events:none;background:#fff;opacity:0}

/* ---------- 結局選擇 ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:18px 16px calc(var(--safe-b) + 34px);
  background:linear-gradient(180deg,rgba(25,10,40,.0),rgba(18,8,30,.94) 18%,rgba(10,5,18,.98));
  transform:translateY(105%);transition:transform .35s cubic-bezier(.2,1.2,.4,1)}
.sheet.show{transform:none}
.sheet h3{font-family:var(--brush);font-weight:400;font-size:32px;text-align:center;color:var(--paper);margin:10px 0 2px}
.sheet .sub{text-align:center;font-size:14px;color:var(--muted);margin-bottom:12px}
.sheet .grp{font-size:13px;color:var(--muted);letter-spacing:.15em;margin:10px 4px 6px}
.sheet .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{padding:12px 4px;border-radius:14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(232,197,71,.4);text-align:center}
.choice:active{transform:scale(.95)}
.choice .ci{font-size:30px;display:block;line-height:1.2}
.choice .ct{font-size:15px;font-weight:700;color:var(--paper)}
.choice.jar{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px}
.choice.jar .ci{font-size:28px}

/* ---------- 結果 ---------- */
#scr-result{align-items:center;justify-content:space-between;text-align:center}
.res-title{font-family:var(--brush);font-size:clamp(30px,9vw,40px);color:var(--paper);margin-top:4vh;line-height:1.3;word-break:break-all;
  text-shadow:0 3px 0 var(--cinnabar-dark)}
.stats{display:flex;gap:12px;justify-content:center;margin-top:12px}
.stat{min-width:110px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.stat b{display:block;font-size:30px;color:#fff}
.stat span{font-size:13px;color:var(--muted)}
.fai{position:relative;width:min(25vw,104px);height:min(48vh,360px);margin:2vh auto;padding:14px 0;
  background:linear-gradient(90deg,#a10b25,#d0142f 30%,#d0142f 70%,#a10b25);
  border:3px solid var(--gold);outline:2px solid #8f0a20;outline-offset:3px;
  display:flex;flex-direction:column;justify-content:space-around;align-items:center;
  box-shadow:0 14px 30px rgba(0,0,0,.5),0 0 40px rgba(232,197,71,.15);transform-origin:50% 0}
.fai span{font-family:var(--title);font-size:min(17vw,70px);line-height:1;color:var(--gold);
  text-shadow:0 2px 0 #6a0614,0 0 10px rgba(255,210,90,.5)}
.fai.drop-in{animation:faiDrop 1s cubic-bezier(.3,1.4,.5,1) both}
@keyframes faiDrop{0%{transform:translateY(-60vh) rotate(-8deg)}60%{transform:translateY(0) rotate(4deg)}80%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.res-btns{width:100%;display:flex;flex-direction:column;gap:12px;margin-bottom:3vh}

/* ---------- 牢房 ---------- */
#scr-jail .list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-content:start;padding:12px 2px 40px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 12px;border-radius:18px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.cell .jarbtn{width:100%;display:flex;justify-content:center}
.cell .jarbtn svg{width:96px;height:auto}
.cell .jarbtn:active svg{transform:scale(.94)}
.cell.new .jarbtn svg{animation:jarWiggle .5s ease-in-out 3}
@keyframes jarWiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.cell .cname{font-family:var(--brush);font-size:24px;color:var(--paper);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cmeta{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.cell .free{margin-top:4px;font-size:13px;color:#ff8f9c;padding:6px 10px;border-radius:10px;border:1px solid rgba(255,120,140,.35)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);margin-top:16vh;line-height:2}
.empty .big{font-size:56px}
.jail-tip{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}

/* ---------- 對話框 ---------- */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(5,2,10,.7);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s}
.modal.show{opacity:1;visibility:visible;transition:opacity .2s}
.modal .box{width:100%;max-width:320px;padding:22px 18px 16px;border-radius:20px;background:#22123a;border:2px solid rgba(232,197,71,.5);text-align:center}
.modal p{white-space:pre-line;font-size:17px;line-height:1.6;margin-bottom:18px}
.modal .acts{display:flex;gap:10px}
.modal .acts .btn{font-size:16px;padding:12px 8px;letter-spacing:.04em}
.btn-danger{background:var(--cinnabar);color:#fff;border:1.5px solid #ff8a9a}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 44px);transform:translateX(-50%);z-index:45;
  background:rgba(0,0,0,.8);border:1px solid var(--paper);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:15px;
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div class="fog"><i></i><i></i><i></i></div>

  <!-- 共用圖形 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="dollSym" viewBox="0 0 200 260">
        <g fill="#0b0a10">
          <rect x="38" y="128" width="22" height="66" rx="11" transform="rotate(28 49 132)"/>
          <rect x="140" y="128" width="22" height="66" rx="11" transform="rotate(-28 151 132)"/>
          <rect x="72" y="196" width="24" height="58" rx="12"/>
          <rect x="104" y="196" width="24" height="58" rx="12"/>
          <path d="M66 116 Q100 104 134 116 L146 206 Q100 222 54 206 Z"/>
          <circle cx="100" cy="68" r="54"/>
          <path d="M98 16 q4 -14 20 -12 q-12 4 -12 16 z"/>
        </g>
      </symbol>
      <symbol id="slipperSym" viewBox="0 0 120 60">
        <path d="M34 38 Q58 4 86 38" fill="none" stroke="#2f6fd6" stroke-width="11" stroke-linecap="round"/>
        <path d="M34 38 Q58 4 86 38" fill="none" stroke="#5b92ee" stroke-width="3" stroke-linecap="round" opacity=".8"/>
        <rect x="3" y="36" width="114" height="16" rx="8" fill="#fbfbff" stroke="#1d4fa8" stroke-width="2.5"/>
        <rect x="6" y="47" width="108" height="6" rx="3" fill="#2f6fd6"/>
      </symbol>
      <symbol id="clogSym" viewBox="0 0 120 64">
        <path d="M40 26 Q60 2 80 26" fill="none" stroke="#C8102E" stroke-width="7" stroke-linecap="round"/>
        <rect x="16" y="38" width="16" height="22" rx="2" fill="#7d4f24" stroke="#4a2c12" stroke-width="2"/>
        <rect x="86" y="38" width="16" height="22" rx="2" fill="#7d4f24" stroke="#4a2c12" stroke-width="2"/>
        <rect x="2" y="24" width="116" height="16" rx="5" fill="#c08446" stroke="#5e3817" stroke-width="2.5"/>
        <path d="M10 30 H60 M68 34 H110" stroke="#8b5a2b" stroke-width="1.5" opacity=".7"/>
      </symbol>
      <symbol id="jarCork" viewBox="0 0 100 130">
        <rect x="31" y="3" width="38" height="17" rx="4" fill="#b07a3c" stroke="#6b4420" stroke-width="2"/>
        <path d="M34 9 H66" stroke="#d9a76a" stroke-width="2" opacity=".7"/>
      </symbol>
      <symbol id="jarSym" viewBox="0 0 100 130">
        <path d="M30 20 H70 V30 Q88 40 88 64 V110 Q88 125 73 125 H27 Q12 125 12 110 V64 Q12 40 30 30 Z"
              fill="rgba(170,215,255,.13)" stroke="rgba(205,235,255,.8)" stroke-width="2.5"/>
      </symbol>
      <symbol id="jarGloss" viewBox="0 0 100 130">
        <path d="M22 62 Q22 46 34 38" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="4" stroke-linecap="round"/>
        <path d="M21 74 V100" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="4" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <!-- 開始畫面 -->
  <section id="scr-start" class="screen active">
    <div class="title-wrap">
      <h1 class="title">小人退散</h1>
      <p class="subtitle">打走小人，好運自然來</p>
    </div>
    <div class="hero" aria-hidden="true">
      <div class="tag">小人</div>
      <svg class="mini"><use href="#dollSym"/></svg>
      <svg class="slap" viewBox="0 0 120 60"><use href="#slipperSym"/></svg>
    </div>
    <div class="start-btns">
      <button class="btn btn-red" id="btnStart">開打</button>
      <button class="btn btn-ghost" id="btnJail">我的牢房（0）</button>
    </div>
  </section>

  <!-- 建立小人 -->
  <section id="scr-create" class="screen">
    <div class="topbar"><button class="back" data-go="start">‹ 返回</button><span></span></div>
    <h2 class="brush">寫下小人的名字</h2>
    <div class="body">
      <label class="field-label" for="nameInput">小人的名字</label>
      <input id="nameInput" class="name-input" type="text" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="小人">
      <div class="counter"><span id="nameCount">0</span> / 12</div>
      <p class="hint-small">名字只存在你的手機，不會上傳。</p>
      <button class="btn btn-red" id="btnToWeapon" style="margin-top:12px">下一步</button>
    </div>
  </section>

  <!-- 選武器 -->
  <section id="scr-weapon" class="screen">
    <div class="topbar"><button class="back" id="weaponBack">‹ 返回</button><span></span></div>
    <h2 class="brush">選武器</h2>
    <p id="weaponSub"></p>
    <div class="cards">
      <button class="wcard" data-weapon="fist">
        <span class="icon">👊</span>
        <span><span class="wname">拳頭</span><span class="pips">傷害 <b></b><b class="off"></b><b class="off"></b></span><span class="wdesc">基本款，一拳一拳來</span></span>
      </button>
      <button class="wcard" data-weapon="slipper">
        <span class="icon"><svg viewBox="0 0 120 60"><use href="#slipperSym"/></svg></span>
        <span><span class="wname">藍白拖</span><span class="pips">傷害 <b></b><b></b><b class="off"></b></span><span class="wdesc">打下去「啪」一聲，超響亮</span></span>
      </button>
      <button class="wcard" data-weapon="clog">
        <span class="icon"><svg viewBox="0 0 120 64"><use href="#clogSym"/></svg></span>
        <span><span class="wname">木屐</span><span class="pips">傷害 <b></b><b></b><b></b></span><span class="wdesc">傳統打小人用鞋，聲音最響</span></span>
      </button>
    </div>
  </section>

  <!-- 開打 -->
  <section id="scr-fight" class="screen">
    <div class="fight-top">
      <button class="icon-btn" id="btnLeave">離開</button>
      <div class="hp">
        <div class="hp-label"><span>生命</span><b id="hpNum">100</b></div>
        <div class="hp-bar"><div class="ghost" id="hpGhost"></div><div class="fill" id="hpFill"></div></div>
      </div>
      <button class="icon-btn" id="btnMute" aria-label="切換靜音">🔊</button>
    </div>
    <div id="arena">
      <div id="stage">
        <div id="stars"></div>
        <div id="dollAnchor">
          <div class="ground"></div>
          <div id="dollKnock">
            <div id="nameTag">小人</div>
            <div id="dollScale"><div id="dollTremble">
              <svg id="dollSvg" viewBox="0 0 200 260" aria-hidden="true">
                <g fill="#0b0a10">
                  <g class="arm armL"><rect x="38" y="128" width="22" height="66" rx="11" transform="rotate(28 49 132)"/></g>
                  <g class="arm armR"><rect x="140" y="128" width="22" height="66" rx="11" transform="rotate(-28 151 132)"/></g>
                  <rect x="72" y="196" width="24" height="58" rx="12"/>
                  <rect x="104" y="196" width="24" height="58" rx="12"/>
                  <path d="M66 116 Q100 104 134 116 L146 206 Q100 222 54 206 Z"/>
                  <circle cx="100" cy="68" r="54"/>
                  <path d="M98 16 q4 -14 20 -12 q-12 4 -12 16 z"/>
                  <g class="bump bump1"><circle cx="70" cy="24" r="17"/><path d="M60 20 a9 9 0 0 1 11 -8" stroke="rgba(255,255,255,.6)" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>
                  <g class="bump bump2"><circle cx="134" cy="28" r="14"/><path d="M126 25 a7 7 0 0 1 9 -6" stroke="rgba(255,255,255,.6)" stroke-width="3" fill="none" stroke-linecap="round"/></g>
                  <g class="bump bump3"><circle cx="154" cy="62" r="11"/><path d="M149 58 a5 5 0 0 1 7 -4" stroke="rgba(255,255,255,.6)" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
                </g>
                <g fill="none" stroke="#e6dcff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path class="crack crack1" d="M96 120 L106 136 L94 148 L106 164 L98 178"/>
                  <path class="crack crack2" d="M58 52 L72 60 L66 74 L80 82"/>
                  <path class="crack crack3" d="M132 140 L120 152 L130 164 L118 180 M120 152 L110 150"/>
                </g>
              </svg>
            </div></div>
          </div>
        </div>
        <div id="bubble" class="tail-left"></div>
        <div id="fx"></div>
      </div>
      <div class="label" style="position:absolute;right:8px;top:calc(12% - 32px);font-family:var(--brush);font-size:24px;color:var(--paper);z-index:4;pointer-events:none">怒</div>
      <div id="rage"><div id="rageFill"></div></div>
      <div id="combo"></div>
      <div id="critBanner">暴擊！傷害×3</div>
      <div id="tapHint">狠狠地點小人！</div>
    </div>
    <div class="sheet" id="endSheet">
      <h3>小人只剩一口氣！</h3>
      <p class="sub">要怎麼處置他？</p>
      <div class="grp">A．送他上路</div>
      <div class="row">
        <button class="choice" data-end="ink"><span class="ci">💧</span><span class="ct">吐墨</span></button>
        <button class="choice" data-end="boom"><span class="ci">💥</span><span class="ct">爆炸</span></button>
        <button class="choice" data-end="space"><span class="ci">🚀</span><span class="ct">放飛外太空</span></button>
      </div>
      <div class="grp">B．留著下次再打</div>
      <button class="choice jar" data-end="jar"><span class="ci">🫙</span><span class="ct">關進玻璃瓶</span></button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="scr-result" class="screen">
    <div>
      <div class="res-title" id="resTitle">小人已退散</div>
      <div class="stats">
        <div class="stat"><b id="resHits">0</b><span>這次打了（下）</span></div>
        <div class="stat"><b id="resCombo">0</b><span>最高連擊</span></div>
      </div>
    </div>
    <div class="fai" id="fai"><span>小</span><span>人</span><span>退</span><span>散</span></div>
    <div class="res-btns">
      <button class="btn btn-red" id="btnAgain">再打一個</button>
      <button class="btn btn-ghost" data-go="start">回首頁</button>
    </div>
  </section>

  <!-- 我的牢房 -->
  <section id="scr-jail" class="screen">
    <div class="topbar"><button class="back" data-go="start">‹ 回首頁</button><span></span></div>
    <h2 class="brush">我的牢房</h2>
    <p class="jail-tip">點瓶子，把他放出來再打一次</p>
    <div class="list" id="jailList"></div>
  </section>

  <div class="modal" id="modal"><div class="box"><p id="modalText"></p>
    <div class="acts"><button class="btn btn-ghost" id="modalNo">取消</button><button class="btn btn-danger" id="modalYes">確定</button></div></div></div>
  <div class="toast" id="toast"></div>
  <div id="flash"></div>
  <footer class="footnote">打完氣消了，記得對自己好一點。</footer>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
 * Storage 模組 —— 全部的讀寫都只走這裡。
 * 目前：只存在本機 localStorage（無法使用時退回記憶體，重新整理就會消失）。
 * 之後要接 Fairy Prompt 的鑰匙／雲端同步時，只要改這個模組的實作，
 * 對外的函式名稱與資料格式維持不變即可。
 *
 * 資料格式（牢房裡的一個小人）：
 *   { id, name, hitsTotal, timesJailed, jailedAt(ISO), updatedAt(ISO) }
 * ===================================================================== */
const Storage = (() => {
  const NS = 'xiaoren-tuisan:v1:';
  const KEY_JAIL = NS + 'jail';
  const KEY_SETTINGS = NS + 'settings';
  const mem = {};
  let persistent = true;
  try { const t = NS + '__probe'; localStorage.setItem(t, '1'); localStorage.removeItem(t); }
  catch (e) { persistent = false; }

  function rawGet(k) {
    if (!persistent) return k in mem ? mem[k] : null;
    try { return localStorage.getItem(k); } catch (e) { return k in mem ? mem[k] : null; }
  }
  function rawSet(k, v) {
    mem[k] = v;
    if (!persistent) return false;
    try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
  }
  function readJSON(k, fallback) {
    const s = rawGet(k);
    if (!s) return fallback;
    try { return JSON.parse(s); } catch (e) { return fallback; }
  }
  const nowISO = () => new Date().toISOString();
  const newId = () => (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const loadJail = () => { const a = readJSON(KEY_JAIL, []); return Array.isArray(a) ? a : []; };
  const saveJail = (a) => rawSet(KEY_JAIL, JSON.stringify(a));

  return {
    /** 這台裝置是否能長期保存（私密瀏覽等情況可能不行） */
    isPersistent: () => persistent,
    /** 列出牢房裡的小人（新的在前） */
    async listPrisoners() {
      return loadJail().sort((a, b) => String(b.jailedAt).localeCompare(String(a.jailedAt)));
    },
    async countPrisoners() { return loadJail().length; },
    async getPrisoner(id) { return loadJail().find(p => p.id === id) || null; },
    /** 關進玻璃瓶：新小人就新增；從牢房放出來再打的，就累加次數 */
    async jailPrisoner({ id, name, hits }) {
      const jail = loadJail();
      const t = nowISO();
      let rec = id ? jail.find(p => p.id === id) : null;
      if (rec) {
        rec.hitsTotal = (rec.hitsTotal || 0) + hits;
        rec.timesJailed = (rec.timesJailed || 1) + 1;
        rec.jailedAt = t; rec.updatedAt = t;
      } else {
        rec = { id: newId(), name, hitsTotal: hits, timesJailed: 1, jailedAt: t, updatedAt: t };
        jail.push(rec);
      }
      saveJail(jail);
      return rec;
    },
    /** 永久釋放（刪除） */
    async deletePrisoner(id) {
      const jail = loadJail();
      const next = jail.filter(p => p.id !== id);
      saveJail(next);
      return next.length !== jail.length;
    },
    getSettings() { return Object.assign({ muted: false }, readJSON(KEY_SETTINGS, {})); },
    saveSettings(patch) {
      const s = Object.assign(this.getSettings(), patch);
      rawSet(KEY_SETTINGS, JSON.stringify(s));
      return s;
    },
  };
})();

/* =====================================================================
 * 音效：全部用 Web Audio 即時合成，沒有任何音檔。
 * iOS 規定要在使用者第一次點擊時才建立 AudioContext。
 * ===================================================================== */
const Sfx = (() => {
  let ctx = null, master = null, noiseBuf = null, muted = false;
  const VOL = 0.9;

  function init() {
    if (ctx) { if (ctx.state !== 'running') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 8;
    comp.attack.value = 0.002; comp.release.value = 0.15;
    master = ctx.createGain();
    master.gain.value = muted ? 0 : VOL;
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050);
    s.connect(ctx.destination); s.start(0);
    if (ctx.state !== 'running') ctx.resume();
  }
  function setMuted(m) {
    muted = m;
    if (master) master.gain.setTargetAtTime(m ? 0 : VOL, ctx.currentTime, 0.01);
  }
  const live = () => ctx && !muted;

  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(type, f0, f1, t, dur, peak, a = 0.003, dest = master) {
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + a + dur);
    const g = ctx.createGain(); env(g, t, a, peak, dur);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + a + dur + 0.05);
    return o;
  }
  function noise(t, dur, peak, type, f0, q = 1, f1 = 0, a = 0.002) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + a + dur);
    const g = ctx.createGain(); env(g, t, a, peak, dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * 0.5); s.stop(t + a + dur + 0.05);
  }
  const jit = () => 0.92 + Math.random() * 0.16;

  const hits = {
    fist(t, r) {               // 悶悶的「砰」
      tone('sine', 170 * r, 45, t, 0.16, 1.0);
      tone('triangle', 95 * r, 40, t, 0.1, 0.6);
      noise(t, 0.05, 0.7, 'lowpass', 1300 * r, 0.8);
    },
    slipper(t, r) {            // 清脆的「啪」＋拖鞋回彈
      noise(t, 0.045, 1.0, 'bandpass', 2700 * r, 0.7);
      noise(t, 0.018, 0.9, 'highpass', 4200, 0.7);
      tone('triangle', 460 * r, 150, t, 0.05, 0.55);
      tone('sine', 130 * r, 60, t, 0.09, 0.6);
      noise(t + 0.038, 0.03, 0.4, 'bandpass', 2200 * r, 1.2);
    },
    clog(t, r) {               // 木頭厚底「叩」，最響
      tone('sine', 740 * r, 700 * r, t, 0.16, 0.85);
      tone('sine', 1210 * r, 1170 * r, t, 0.1, 0.5);
      tone('square', 270 * r, 240 * r, t, 0.05, 0.28);
      noise(t, 0.05, 1.0, 'bandpass', 1500 * r, 3);
      tone('sine', 120 * r, 38, t, 0.24, 1.0);
      noise(t + 0.05, 0.04, 0.35, 'bandpass', 1300 * r, 4);
    },
  };

  return {
    init, setMuted, isMuted: () => muted,
    hit(weapon, crit) {
      if (!live()) return;
      const t = ctx.currentTime, r = jit();
      hits[weapon](t, r);
      if (crit) {
        tone('sine', 75, 30, t, 0.45, 1.0);
        noise(t, 0.3, 0.6, 'lowpass', 2600, 1, 220);
        tone('sawtooth', 900, 1800, t, 0.1, 0.12);
      }
    },
    critStart() {
      if (!live()) return;
      const t = ctx.currentTime;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2400; f.connect(master);
      tone('sawtooth', 180, 1400, t, 0.28, 0.35, 0.01, f);
      tone('sine', 196, 190, t + 0.22, 1.1, 0.7, 0.005);   // 銅鑼
      tone('sine', 293, 288, t + 0.22, 0.8, 0.35, 0.005);
      tone('sine', 523, 515, t + 0.22, 0.5, 0.2, 0.005);
      noise(t + 0.22, 0.4, 0.5, 'bandpass', 900, 2, 400);
    },
    /** 小人的聲音：用合成的嘰嘰喳喳音節，依情緒改變音高走向 */
    voice(stage, text) {
      if (!live()) return;
      const n = Math.max(2, Math.min(7, (text.match(/[㐀-鿿]/g) || []).length));
      const t0 = ctx.currentTime + 0.02;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1300; bp.Q.value = 1.2;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
      const g = ctx.createGain(); g.gain.value = 0.55;
      bp.connect(lp); lp.connect(g); g.connect(master);
      const base = stage === 'pain' ? 560 : stage === 'beg' ? 470 : 380;
      const step = stage === 'cry' ? 0.2 : 0.105;
      for (let i = 0; i < n; i++) {
        const t = t0 + i * step;
        const f = base * (0.9 + Math.random() * 0.25);
        let o;
        if (stage === 'pain') {
          const up = i === 0 ? 1.5 : 1.15;
          o = tone('square', f * up, f * 0.7, t, 0.09, 0.5, 0.006, bp);
        } else if (stage === 'beg') {
          o = tone('square', f * 1.05, f * 0.92, t, 0.09, 0.45, 0.008, bp);
        } else {
          o = tone('triangle', f, f * 0.72, t, 0.17, 0.7, 0.02, bp);
        }
        if (stage !== 'pain') {          // 求饒、哭的顫音
          const lfo = ctx.createOscillator(); lfo.frequency.value = stage === 'cry' ? 9 : 7;
          const lg = ctx.createGain(); lg.gain.value = f * (stage === 'cry' ? 0.06 : 0.04);
          lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + 0.3);
        }
      }
    },
    ui() { if (!live()) return; tone('sine', 660, 990, ctx.currentTime, 0.06, 0.2); },
    ink() {
      if (!live()) return;
      const t = ctx.currentTime;
      tone('sine', 260, 70, t, 0.35, 0.9, 0.01);
      noise(t, 0.4, 0.8, 'lowpass', 900, 2, 150, 0.01);
      [0.35, 0.5, 0.62, 0.8].forEach((d, i) => tone('sine', 1100 - i * 120, 380, t + d, 0.07, 0.35));
    },
    boom() {
      if (!live()) return;
      const t = ctx.currentTime;
      tone('sine', 95, 26, t, 1.0, 1.0, 0.005);
      noise(t, 1.3, 1.0, 'lowpass', 5000, 0.8, 140, 0.004);
      for (let i = 0; i < 8; i++) noise(t + 0.15 + Math.random() * 0.8, 0.03, 0.35, 'highpass', 3000, 1);
    },
    whoosh() {
      if (!live()) return;
      const t = ctx.currentTime;
      noise(t, 1.5, 0.7, 'bandpass', 300, 2, 3200, 0.35);
      tone('sine', 200, 1200, t, 1.6, 0.15, 0.4);
    },
    twinkle() {
      if (!live()) return;
      const t = ctx.currentTime;
      [1568, 2093, 2637, 3136, 4186].forEach((f, i) => tone('sine', f, f, t + i * 0.07, 0.55, 0.22, 0.004));
    },
    suck() {
      if (!live()) return;
      const t = ctx.currentTime;
      tone('sine', 160, 1500, t, 0.45, 0.45, 0.02);
      noise(t, 0.45, 0.4, 'bandpass', 700, 2, 4200, 0.05);
    },
    cork() {
      if (!live()) return;
      const t = ctx.currentTime;
      tone('sine', 720, 170, t, 0.07, 0.9);
      noise(t, 0.03, 0.5, 'bandpass', 1800, 2);
      tone('sine', 2900, 2900, t + 0.05, 0.7, 0.25);
      tone('sine', 4150, 4150, t + 0.05, 0.45, 0.12);
    },
    stamp() {
      if (!live()) return;
      const t = ctx.currentTime;
      tone('sine', 120, 50, t, 0.3, 0.9);
      [784, 988, 1175, 1568].forEach((f, i) => tone('triangle', f, f, t + 0.15 + i * 0.09, 0.4, 0.2));
    },
  };
})();

/* =====================================================================
 * 小工具
 * ===================================================================== */
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const clampName = (s) => Array.from(s.trim()).slice(0, 12).join('');

function show(id) {
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === 'scr-' + id));
  if (id === 'start') refreshJailCount();
  if (id === 'jail') renderJail();
}
function toast(msg, ms = 1800) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}
function confirmBox(text, yesLabel) {
  return new Promise(res => {
    const m = $('#modal');
    $('#modalText').textContent = text;
    $('#modalYes').textContent = yesLabel || '確定';
    m.classList.add('show');
    const done = (v) => { m.classList.remove('show'); $('#modalYes').onclick = $('#modalNo').onclick = null; res(v); };
    $('#modalYes').onclick = () => done(true);
    $('#modalNo').onclick = () => done(false);
  });
}
function flash(color = '#fff', peak = 0.5, ms = 160) {
  const f = $('#flash'); f.style.background = color;
  f.animate([{ opacity: peak }, { opacity: 0 }], { duration: ms, easing: 'ease-out' });
}

// 全域：第一次碰螢幕就解鎖音效；擋掉雙指縮放、長按選單
document.addEventListener('pointerdown', () => Sfx.init(), { capture: true, passive: true });
['gesturestart', 'gesturechange', 'dblclick'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('contextmenu', e => { if (!e.target.closest('input')) e.preventDefault(); });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

/* =====================================================================
 * 遊戲資料
 * ===================================================================== */
const WEAPONS = {
  fist:    { name: '拳頭',   dmg: 1, shake: 5,  onos: ['砰！', '咚！', '碰！'] },
  slipper: { name: '藍白拖', dmg: 2, shake: 8,  onos: ['啪！', '啪！！', '啪啪！'] },
  clog:    { name: '木屐',   dmg: 3, shake: 12, onos: ['叩！', '咚！', '喀！'] },
};
const LINES = {
  pain: ['啊——！', '好痛啊！', '你敢打我？', '哎呀我的頭！'],
  beg:  ['饒命啊！', '我不敢了，我不敢了！', '大俠手下留情！', '我以後不說人壞話了！', '放過我吧！'],
  cry:  ['嗚嗚嗚……', '我錯了……', '我再也不害人了……', '救命啊……'],
};
const CRIT_MS = 3500;
const COMBO_GAP = 700;

const game = {
  name: '小人', prisonerId: null, weapon: 'slipper',
  hp: 100, hits: 0, combo: 0, maxCombo: 0, lastHit: 0,
  rage: 0, critUntil: 0, inCrit: false,
  lastLine: '', lastLineAt: 0, stage: 'pain',
  active: false, ended: false, lastFrame: 0,
};

/* ---------- 首頁 / 建立 / 選武器 ---------- */
async function refreshJailCount() {
  const n = await Storage.countPrisoners();
  $('#btnJail').textContent = `我的牢房（${n}）`;
}
const nameInput = $('#nameInput');
nameInput.addEventListener('input', () => {
  const arr = Array.from(nameInput.value);
  if (arr.length > 12) nameInput.value = arr.slice(0, 12).join('');
  $('#nameCount').textContent = Array.from(nameInput.value).length;
});
$('#btnStart').addEventListener('click', () => {
  Sfx.ui(); game.prisonerId = null; nameInput.value = ''; $('#nameCount').textContent = '0'; show('create');
});
$('#btnJail').addEventListener('click', () => { Sfx.ui(); show('jail'); });
$('#btnToWeapon').addEventListener('click', () => {
  nameInput.blur();
  game.name = clampName(nameInput.value) || '小人';
  game.prisonerId = null;
  $('#weaponSub').textContent = `要用什麼打「${game.name}」？`;
  Sfx.ui(); show('weapon');
});
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnToWeapon').click(); });
$('#weaponBack').addEventListener('click', () => show(game.prisonerId ? 'jail' : 'create'));
$$('[data-go]').forEach(b => b.addEventListener('click', () => show(b.dataset.go)));
$$('.wcard').forEach(c => c.addEventListener('click', () => { Sfx.ui(); startFight(c.dataset.weapon); }));

/* ---------- 開打 ---------- */
const arena = $('#arena'), stage = $('#stage'), fx = $('#fx');
const anchor = $('#dollAnchor'), knock = $('#dollKnock'), dollScale = $('#dollScale');
const tremble = $('#dollTremble'), doll = $('#dollSvg'), nameTag = $('#nameTag');
const bubble = $('#bubble'), comboEl = $('#combo'), rageFill = $('#rageFill');
const hpFill = $('#hpFill'), hpGhost = $('#hpGhost'), hpNum = $('#hpNum');

function resetDollVisuals() {
  [anchor, knock, dollScale, nameTag, stage, $('#stars')].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  anchor.style.opacity = ''; anchor.style.transform = ''; anchor.style.bottom = ''; anchor.style.transformOrigin = '';
  doll.setAttribute('class', '');
  tremble.classList.remove('tremble');
  $('#stars').style.opacity = 0;
  fx.innerHTML = '';
  bubble.classList.remove('show');
}

function startFight(weapon) {
  Object.assign(game, {
    weapon, hp: 100, hits: 0, combo: 0, maxCombo: 0, lastHit: 0,
    rage: 0, critUntil: 0, inCrit: false, lastLine: '', lastLineAt: 0, stage: 'pain',
    active: true, ended: false, lastFrame: performance.now(),
  });
  resetDollVisuals();
  nameTag.textContent = game.name;
  arena.classList.remove('crit');
  $('#endSheet').classList.remove('show');
  $('#tapHint').classList.remove('hide');
  comboEl.classList.remove('show');
  updateHP(true);
  show('fight');
  requestAnimationFrame(loop);
}

function updateHP(instant) {
  const k = game.hp / 100;
  if (instant) { hpGhost.style.transition = 'none'; requestAnimationFrame(() => hpGhost.style.transition = ''); }
  hpFill.style.transform = `scaleX(${k})`;
  hpGhost.style.transform = `scaleX(${k})`;
  hpNum.textContent = game.hp;
  anchor.style.setProperty('--s', (0.3 + 0.7 * k).toFixed(3));
  const hp = game.hp;
  doll.classList.toggle('b1', hp < 70);
  doll.classList.toggle('b2', hp < 55);
  doll.classList.toggle('b3', hp < 45);
  doll.classList.toggle('c1', hp < 40);
  doll.classList.toggle('c2', hp < 28);
  doll.classList.toggle('c3', hp < 20);
  tremble.classList.toggle('tremble', hp < 15);
}

const stageOf = (hp) => hp >= 70 ? 'pain' : hp >= 30 ? 'beg' : 'cry';

function say(force) {
  const now = performance.now();
  const st = stageOf(game.hp);
  const changed = st !== game.stage;
  game.stage = st;
  if (!force && !changed && (now - game.lastLineAt < 1300 || Math.random() > 0.5)) return;
  const pool = LINES[st].filter(l => l !== game.lastLine);
  const line = pick(pool);
  game.lastLine = line; game.lastLineAt = now;
  bubble.textContent = line;
  placeBubble();
  bubble.classList.remove('show'); void bubble.offsetWidth; bubble.classList.add('show');
  clearTimeout(say._t); say._t = setTimeout(() => bubble.classList.remove('show'), 1500);
  Sfx.voice(st, line);
}
let bubbleSide = 1;
function placeBubble() {
  const a = arena.getBoundingClientRect();
  const d = dollScale.getBoundingClientRect();
  bubbleSide = -bubbleSide;
  const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
  let x = bubbleSide > 0 ? d.right - d.width * 0.22 - a.left : d.left + d.width * 0.22 - bw - a.left;
  x = Math.max(8, Math.min(a.width - bw - 44, x));
  let y = d.top - a.top + d.height * 0.06 - bh;
  y = Math.max(8, y);
  bubble.style.left = x + 'px'; bubble.style.top = y + 'px';
  bubble.classList.toggle('tail-left', bubbleSide < 0 ? false : true);
  bubble.classList.toggle('tail-right', bubbleSide < 0);
}

let knockAnim = null, flashT = 0, hurtT = 0;
function dollReact(dir, strength) {
  const k = 10 + strength * 2.2, deg = 4 + strength * 0.9;
  if (knockAnim) knockAnim.cancel();
  knockAnim = knock.animate([
    { transform: 'translate(0,0) rotate(0) scale(1,1)' },
    { transform: `translate(${dir * k}px,${-k * 0.25}px) rotate(${dir * deg}deg) scale(1.08,.88)`, offset: 0.22 },
    { transform: `translate(${-dir * k * 0.3}px,0) rotate(${-dir * deg * 0.35}deg) scale(.96,1.05)`, offset: 0.6 },
    { transform: 'translate(0,0) rotate(0) scale(1,1)' },
  ], { duration: 320, easing: 'ease-out' });
  doll.classList.add('flash', 'hurt');
  clearTimeout(flashT); flashT = setTimeout(() => doll.classList.remove('flash'), 70);

/* 畫面晃動（iOS 不能震動，用晃動＋閃光代替） */
let shakeAmp = 0, shakeRaf = 0;
function shake(amp) {
  shakeAmp = Math.max(shakeAmp, amp);
  if (!shakeRaf) shakeRaf = requestAnimationFrame(shakeTick);
}
function shakeTick() {
  if (shakeAmp < 0.4) { arena.style.transform = ''; shakeAmp = 0; shakeRaf = 0; return; }
  arena.style.transform = `translate(${rand(-1, 1) * shakeAmp}px,${rand(-1, 1) * shakeAmp}px) rotate(${rand(-1, 1) * shakeAmp * 0.08}deg)`;
  shakeAmp *= 0.8;
  shakeRaf = requestAnimationFrame(shakeTick);
}

function addFx(el, x, y, frames, opts) {
  el.style.left = x + 'px'; el.style.top = y + 'px';
  fx.appendChild(el);
  const a = el.animate(frames, opts);
  a.onfinish = () => el.remove();
  return a;
}
function weaponSwing(x, y, crit) {
  const w = game.weapon;
  const el = document.createElement('div');
  if (w === 'fist') {
    el.className = 'swing fist'; el.textContent = '👊';

      { transform: 'scale(.85) rotate(0)', opacity: 1, offset: 0.3 },
      { transform: 'scale(1)', opacity: 1, offset: 0.6 },
      { transform: 'scale(1)', opacity: 0 },
    ], { duration: 260, easing: 'ease-out' });
  } else {
    el.className = 'swing';

      ? '<svg viewBox="0 0 120 60"><use href="#slipperSym"/></svg>'
      : '<svg viewBox="0 0 120 64"><use href="#clogSym"/></svg>';

    addFx(el, x - 30, y - 52, [
      { transform: `rotate(78deg) scale(${s})`, opacity: 0.9 },

      { transform: `rotate(30deg) scale(${s})`, opacity: 0 },

}
function impactBurst(x, y, crit) {

  b.innerHTML = `<svg viewBox="0 0 110 110"><polygon points="${pts.join(' ')}" fill="${crit ? '#ffe27a' : '#fff6d0'}" stroke="${crit ? '#ff5a2a' : '#E8C547'}" stroke-width="4" stroke-linejoin="round"/></svg>`;
  addFx(b, x, y, [

function damageNumber(x, y, dmg, crit) {

function inkSpray(x, y, count, dirBias) {
  if (fx.childElementCount > 140) return;
  for (let i = 0; i < count; i++) {
    const s = rand(4, 11);
    const d = document.createElement('div'); d.className = 'drop';

function onHit(e) {
  if (!game.active || game.ended) return;
  e.preventDefault();
  const now = performance.now();
  const gap = now - game.lastHit;
  const a = arena.getBoundingClientRect();
  const x = e.clientX - a.left, y = e.clientY - a.top;

  game.combo = gap < COMBO_GAP ? game.combo + 1 : 1;
  game.maxCombo = Math.max(game.maxCombo, game.combo);
  game.lastHit = now;
  game.hits++;

  let crit = now < game.critUntil;
  if (!crit) {
    game.rage = Math.min(100, game.rage + 6 + (gap < 180 ? 7 : gap < 300 ? 4 : gap < 450 ? 1 : 0));
    if (game.rage >= 100) { startCrit(now); crit = true; }
  }
  const W = WEAPONS[game.weapon];
  const dmg = W.dmg * (crit ? 3 : 1);
  game.hp = Math.max(1, game.hp - dmg);

  // ---- 打擊回饋 ----
  Sfx.hit(game.weapon, crit);
  weaponSwing(x, y, crit);
  impactBurst(x, y, crit);
  const d = dollScale.getBoundingClientRect();
  const cx = d.left + d.width / 2 - a.left;
  const dir = x < cx ? 1 : -1;
  dollReact(dir, W.dmg * (crit ? 2 : 1));
  damageNumber(Math.min(Math.max(x, 30), a.width - 70), y, dmg, crit);
  inkSpray(Math.min(Math.max(x, d.left - a.left), d.right - a.left), Math.min(Math.max(y, d.top - a.top), d.bottom - a.top), crit ? 9 : 2 + W.dmg, dir);
  shake(W.shake * (crit ? 1.7 : 1));
  if (game.weapon === 'clog' || crit) flash(crit ? '#fff3c0' : '#fff', crit ? 0.22 : 0.08, 120);
  updateHP();
  say(game.hits === 1);
  if (game.combo >= 3) {
    comboEl.innerHTML = `${game.combo}<small>連擊</small>`;
    comboEl.classList.add('show');
    comboEl.animate([{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 140 });
  }
  if (game.hits === 1) $('#tapHint').classList.add('hide');

  if (game.hp <= 1) {
    game.ended = true;
    setTimeout(() => {
      const sheet = $('#endSheet');
      sheet.classList.add('show');
      // 把小人往上移，不要被選單擋住
      const fr = $('#scr-fight').getBoundingClientRect(), ar = arena.getBoundingClientRect();
      const overlap = sheet.offsetHeight - (fr.bottom - ar.bottom);
      anchor.style.bottom = Math.max(overlap + 34, ar.height * 0.13) + 'px';
      Sfx.voice('cry', '救命啊');
      setTimeout(() => {
        bubble.textContent = '救命啊……'; placeBubble(); bubble.classList.add('show');
      }, 480);
    }, 500);
  }
}
arena.addEventListener('pointerdown', onHit, { passive: false });

function startCrit(now) {
  game.critUntil = now + CRIT_MS; game.inCrit = true; game.rage = 100;
  arena.classList.add('crit');
  const banner = $('#critBanner');
  banner.style.animation = 'none'; void banner.offsetWidth; banner.style.animation = '';
  flash('#fff', 0.85, 320);
  shake(22);
  Sfx.critStart();
}
function endCrit() { game.inCrit = false; game.rage = 0; arena.classList.remove('crit'); }

function loop() {
  if (!game.active) return;
  const now = performance.now();
  const dt = Math.min(0.05, (now - game.lastFrame) / 1000);
  game.lastFrame = now;
  if (game.inCrit) {
    if (now >= game.critUntil || game.ended) endCrit();
    else game.rage = 100 * (game.critUntil - now) / CRIT_MS;
  } else if (now - game.lastHit > 350) {
    game.rage = Math.max(0, game.rage - 30 * dt);
  }
  rageFill.style.transform = `scaleY(${(game.rage / 100).toFixed(3)})`;
  if (game.combo && now - game.lastHit > 1000) { comboEl.classList.remove('show'); }
  requestAnimationFrame(loop);
}

let finishing = false;
async function finish(kind) {
  if (finishing) return; finishing = true;
  $('#endSheet').classList.remove('show');
  bubble.classList.remove('show');
  tremble.classList.remove('tremble');
  game.hp = 0; hpFill.style.transform = 'scaleX(0)'; hpGhost.style.transform = 'scaleX(0)'; hpNum.textContent = 0;
  try {
    if (kind === 'ink') await endInk();
    else if (kind === 'boom') await endBoom();
    else if (kind === 'space') await endSpace();
    else if (kind === 'jar') { await endJar(); return; }
    if (game.prisonerId) await Storage.deletePrisoner(game.prisonerId);
    showResult();
  } finally { game.active = false; finishing = false; }
}

function dollCenter() {
  const a = arena.getBoundingClientRect(), d = dollScale.getBoundingClientRect();
  return { x: d.left + d.width / 2 - a.left, y: d.top + d.height / 2 - a.top, top: d.top - a.top, h: d.height, w: d.width, aw: a.width, ah: a.height };
}
function blobPath(cx, cy, r, n = 14, jag = 0.35) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const ang = (Math.PI * 2 * i) / n;
    const rr = r * (1 - jag / 2 + Math.random() * jag) * (i % 2 ? 0.8 : 1.12);
    pts.push([cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr]);
  }
  let d = '';
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
    d += (i === 0 ? `M${mx.toFixed(1)} ${my.toFixed(1)}` : '') + ` Q${q[0].toFixed(1)} ${q[1].toFixed(1)} ${((q[0] + pts[(i + 2) % n][0]) / 2).toFixed(1)} ${((q[1] + pts[(i + 2) % n][1]) / 2).toFixed(1)}`;
  }
  return d + 'Z';
}

function fmtTime(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const p = (x) => String(x).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
async function renderJail() {
  const list = $('#jailList');
  const items = await Storage.listPrisoners();
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<div class="empty"><div class="big">🫙</div>牢房空空的<br>去抓一個小人來關吧</div>';
    return;
  }
  for (const p of items) {
    const cell = document.createElement('div'); cell.className = 'cell'; cell.dataset.id = p.id;
    cell.innerHTML = `<button class="jarbtn" aria-label="放出來再打"><svg viewBox="0 0 100 130">
        <use href="#jarSym"/><use href="#dollSym" x="30" y="60" width="40" height="56"/><use href="#jarGloss"/><use href="#jarCork"/></svg></button>
      <div class="cname"></div>
      <div class="cmeta">被打 <b class="h"></b> 下<br><span class="t"></span> 收押</div>
      <button class="free">永久釋放</button>`;
    cell.querySelector('.cname').textContent = p.name;
    cell.querySelector('.h').textContent = p.hitsTotal;
    cell.querySelector('.t').textContent = fmtTime(p.jailedAt);
    cell.querySelector('.jarbtn').addEventListener('click', () => releaseToFight(p));
    cell.querySelector('.free').addEventListener('click', async () => {
      const ok = await confirmBox(`要永久釋放「${p.name}」嗎？\n他會從牢房消失，不能復原。`, '永久釋放');
      if (!ok) return;
      await Storage.deletePrisoner(p.id);
      renderJail();
      toast('已永久釋放');
    });
    list.appendChild(cell);
  }
}
function highlightJar(id) {
  setTimeout(() => {
    const el = document.querySelector(`.cell[data-id="${CSS.escape(id)}"]`);
    if (el) { el.classList.add('new'); el.scrollIntoView({ block: 'nearest' }); }
  }, 80);
}
function releaseToFight(p) {
  Sfx.ui();
  game.prisonerId = p.id; game.name = p.name;
  $('#weaponSub').textContent = `把「${p.name}」放出來再打一次，用什麼打？`;
  show('weapon');
}

/* ---------- 啟動 ---------- */
const settings = Storage.getSettings();
Sfx.setMuted(!!settings.muted); syncMuteBtn();
refreshJailCount();
})();
</script>
</body>
</html>
